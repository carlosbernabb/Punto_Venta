<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Punto de Venta Naturista</title>
    <script>try { if (localStorage.getItem('appTheme') === 'dark') document.documentElement.classList.add('dark-mode'); } catch (e) { }</script>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/dark.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <div class="login-left">
            <div class="brand-section">
                <div class="brand-icon" style="position:relative; cursor:pointer;"
                    onclick="document.getElementById('logoUploadInput').click()" title="Cambiar Logo">
                    <img id="mainAppLogo" src="../assets/logo.png" alt="La Casa del Ajo Logo" class="logo-image">
                    <input type="file" id="logoUploadInput" accept="image/*" style="display:none;"
                        onchange="handleLogoUpload(event)">
                </div>
                <h1 class="brand-title" id="brandTitle">Punto de Venta</h1>
                <p class="brand-subtitle" id="brandSubtitle">Sistema La Casa del Ajo</p>
            </div>
            <!-- Store Selection on Left (Step 2, shown after login when applicable) -->
            <div class="stores-section" id="storesSection" style="display: none;">
                <h3 class="stores-title">Selecciona tu Tienda</h3>
                <div id="storesContainer" class="stores-list-left">
                    <div class="text-center">
                        <div class="spinner-small-white"></div>
                        <p class="text-muted-white mt-1">Cargando...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-right">
            <div class="login-card">
                <div id="alertContainer"></div>

                <!-- Step 1: Login Form -->
                <div id="loginFormStep">
                    <h2 class="login-title">Iniciar Sesión</h2>
                    <p class="login-description">Ingresa tus credenciales para continuar</p>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" id="username" class="form-control" placeholder="Ingresa tu usuario"
                                required autocomplete="username">
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="password-wrapper">
                                <input type="password" id="password" class="form-control"
                                    placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                                <button type="button" class="toggle-password"
                                    onclick="togglePasswordVisibility('password', this)" tabindex="-1">👁️</button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">
                            <span id="loginBtnText">Iniciar Sesión</span>
                            <span id="loginBtnSpinner" class="spinner-small" style="display: none;"></span>
                        </button>
                    </form>

                    <div class="login-footer">
                        <p class="text-muted text-center">
                            <small>¿Olvidaste tu contraseña? Contacta al administrador</small>
                        </p>
                    </div>
                </div>

                <!-- Step 2: Store selection prompt (only admins / empleados sin tienda asignada) -->
                <div id="storeSelectStep" class="disabled-message" style="display: none;">
                    <div class="disabled-icon">🏪</div>
                    <h3 id="storeSelectGreeting">Selecciona tu tienda</h3>
                    <p>Elige la ubicación donde trabajarás hoy en el panel izquierdo</p>
                    <button type="button" class="btn btn-secondary" id="backToLoginBtn" style="margin-top: 16px;">
                        ← Usar otra cuenta
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/supabase.js"></script>
    <script src="../config/supabase.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/login.js"></script>
</body>

</html>
